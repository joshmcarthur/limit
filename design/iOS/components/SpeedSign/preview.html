<!-- @dsCard group="Speed" height=170 subtitle="Limit, three digits, stale, unknown, small" -->
<!doctype html><html><head><meta charset="utf-8"><title>SpeedSign</title></head><body>
<div class="lm-row">
 <div class="lm-col"><div class="lm-sign" role="img" aria-label="Speed limit 50 kilometres per hour">50</div><div class="lm-label">Limit</div></div>
 <div class="lm-col"><div class="lm-sign lm-sign--3" role="img" aria-label="Speed limit 100 kilometres per hour">100</div><div class="lm-label">Three digits</div></div>
 <div class="lm-col"><div class="lm-sign" role="img" aria-label="Speed limit 30 kilometres per hour, data may be out of date">30<span class="lm-sign__badge">!</span></div><div class="lm-label">Stale data</div></div>
 <div class="lm-col"><div class="lm-sign lm-sign--unknown" role="img" aria-label="Speed limit unknown">–</div><div class="lm-label">Unknown</div></div>
 <div class="lm-col"><div class="lm-sign" style="--size:56px">80</div><div class="lm-label">56 pt</div></div>
</div>
</body></html>

<!-- @dsCard group="Driving" height=270 subtitle="Lock Screen (normal, over), Dynamic Island compact and minimal" -->
<!doctype html><html><head><meta charset="utf-8"><title>LiveActivity</title></head><body>
<div class="lm-row" style="align-items:flex-start">
 <div style="display:flex;flex-direction:column;gap:12px">
  <div class="lm-la"><div class="lm-sign" style="--size:56px">50</div>
   <div class="lm-la__mid"><div class="lm-la__road">Main North Road</div><div class="lm-la__meta">Limit from NZTA register</div></div>
   <div class="lm-la__speed"><div class="lm-la__num">47</div><div class="lm-la__unit">km/h</div></div></div>
  <div class="lm-la"><div class="lm-sign" style="--size:56px">30</div>
   <div class="lm-la__mid"><div class="lm-la__road">Gloucester Street</div><div class="lm-la__meta">Limit from NZTA register</div></div>
   <div class="lm-la__speed"><div class="lm-la__num lm-over">38</div><div class="lm-la__unit" style="color:var(--caution-ink);font-weight:600">+8 over</div></div></div>
 </div>
 <div style="display:flex;flex-direction:column;gap:16px;align-items:center;padding-top:8px">
  <div class="lm-island"><div class="lm-sign" style="--size:26px;font-size:11px">50</div><div class="lm-island__cut"></div><div class="lm-island__speed">47<small>km/h</small></div></div>
  <div class="lm-label" style="margin:0">Compact</div>
  <div class="lm-island lm-island--min"><div class="lm-sign" style="--size:26px;font-size:11px">50</div></div>
  <div class="lm-label" style="margin:0">Minimal</div>
 </div>
</div>
</body></html>

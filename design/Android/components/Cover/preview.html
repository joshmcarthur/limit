<!doctype html><html><head><meta charset="utf-8"><title>Cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<style>
body{margin:0;background:var(--surface)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface)}
.cv svg{position:absolute;left:0;top:0}
.b-primary{fill:var(--primary)} .b-ring{fill:var(--sign-ring)} .b-caution{fill:var(--caution)} .b-deep{fill:var(--on-primary-container)}
.blk{rx:var(--corner-extra-large);ry:var(--corner-extra-large)}
.pill{fill:var(--on-primary)}
.disc{fill:var(--sign-face);stroke:var(--sign-ring);stroke-width:9px}
.annulus{fill:none;stroke:var(--sign-face);stroke-width:20px}
.txt{position:absolute;left:48px;bottom:40px;max-width:440px}
.nm{font-family:var(--font-numerals);font-weight:800;font-size:80px;line-height:.95;letter-spacing:-.02em;color:var(--on-surface)}
.tg{font-family:var(--font-text);font-size:14px;line-height:18px;color:var(--on-surface-variant);margin-top:12px}
</style></head><body>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: primary slab 192x236 bleeding top, sign-ring 272x128 bleeding top and right, caution 272x128 bleeding right and bottom, on-primary-container 192x96 bleeding bottom; gaps space-4 (16)
     arrangement: two columns of rounded slabs, Material 3 extra-large corners (28), bleeding off three edges
     pattern: Material's fully round shape language: three on-primary pills (FAB/button silhouettes) at a 40px pitch on the primary slab, plus the sign itself: one oversized sign-face annulus over the red block and one sign disc on the caution block
     scales: corner-extra-large for slabs, corner-full (half short side) for pills, space-4 gaps -->
<rect class="b-primary blk" x="480" y="-28" width="192" height="236"/>
<rect class="b-ring blk" x="688" y="-28" width="300" height="156"/>
<rect class="b-caution blk" x="688" y="144" width="300" height="172"/>
<rect class="b-deep blk" x="480" y="224" width="192" height="96"/>
<rect class="pill" x="512" y="40" width="128" height="24" rx="12"/>
<rect class="pill" x="512" y="80" width="96" height="24" rx="12"/>
<rect class="pill" x="512" y="120" width="112" height="24" rx="12"/>
<circle class="annulus" cx="900" cy="36" r="72"/>
<circle class="disc" cx="904" cy="216" r="40"/>
</svg>
<div class="txt"><div class="nm">Limit for Android</div><div class="tg">Speed limits for Aotearoa New Zealand roads, the Android way.</div></div>
</div>
</body></html>

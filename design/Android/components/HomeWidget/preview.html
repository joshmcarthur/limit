<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto:wght@400;500&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"><title>HomeWidget</title></head><body>
<div style="display:flex;flex-direction:column;gap:16px;padding:16px">
<div style="display:flex;gap:16px">
<div class="la-w la-w--2x2"><div class="la-sign" style="--size:64px;font-size:22px">–</div><div><div style="font:500 14px/20px var(--font-text)">Limit</div><div class="la-cap">Checked today, 6:40 am</div><button type="button" class="la-btn" style="margin-top:8px;height:36px;padding:0 14px"><span class="ms" style="font-size:18px">directions_car</span>Start drive</button></div></div>
<div class="la-w la-w--2x2"><div class="la-sign" style="--size:72px">50</div><div><div class="la-w__num">47</div><div class="la-cap">km/h</div></div></div>

<div class="la-w la-w--4x1"><div class="la-sign" style="--size:56px">30</div><div style="flex:1;min-width:0"><div style="font:500 14px/20px var(--font-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Gloucester Street</div><div class="la-cap" style="color:var(--caution-ink)">8 over</div></div><div class="la-w__num over" style="font-size:36px">38</div><button type="button" aria-label="End drive" style="width:48px;height:48px;border-radius:50%;border:0;background:var(--secondary-container);color:var(--on-secondary-container);display:grid;place-items:center"><span class="ms">stop</span></button></div>
</div>

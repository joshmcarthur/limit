<!-- @dsCard group="Surfaces" height=420 subtitle="Normal, over the limit, unknown, status bar chip" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto:wght@400;500&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"><title>DriveNotification</title></head><body>
<div style="display:flex;flex-direction:column;gap:12px;padding:16px">
<div class="la-notif"><div class="la-notif__head"><span class="la-mono" style="width:18px;height:18px;border-width:2px;font-size:7px;color:var(--primary)">50</span><span>Limit · Driving</span></div>
<div class="la-notif__body"><div style="flex:1"><div class="la-notif__t">50 km/h · Main North Road</div><div class="la-notif__s">Your speed 47 km/h</div></div><div class="la-sign" style="--size:44px">50</div></div>
<div class="la-notif__acts"><button type="button" class="la-btn la-btn--text">End drive</button></div></div>
<div class="la-notif"><div class="la-notif__head"><span class="la-mono" style="width:18px;height:18px;border-width:2px;font-size:7px;color:var(--primary)">30</span><span>Limit · Driving</span></div>
<div class="la-notif__body"><div style="flex:1"><div class="la-notif__t">30 km/h · Gloucester Street</div><div class="la-notif__s">Your speed 38 km/h · <span style="color:var(--caution-ink);font-weight:500">8 over</span></div></div><div class="la-sign" style="--size:44px">30</div></div>
<div class="la-notif__acts"><button type="button" class="la-btn la-btn--text">End drive</button></div></div>
<div class="la-notif"><div class="la-notif__head"><span class="la-mono" style="width:18px;height:18px;border-width:2px;font-size:7px;color:var(--unknown)">–</span><span>Limit · Driving</span></div>
<div class="la-notif__body"><div style="flex:1"><div class="la-notif__t">Limit unknown</div><div class="la-notif__s">Finding your road…</div></div><div class="la-sign la-sign--unknown" style="--size:44px">–</div></div>
<div class="la-notif__acts"><button type="button" class="la-btn la-btn--text">End drive</button></div></div>
<div style="display:flex;align-items:center;gap:12px"><span class="la-chip"><span class="la-mono" style="width:18px;height:18px;border-width:2px;font-size:7px;background:#fff;color:#000;border-color:#c8102e">50</span>50</span><span class="la-cap">Live Update chip, if eligible</span></div>
</div>
</body></html>

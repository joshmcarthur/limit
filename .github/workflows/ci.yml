name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-macos:
    name: LimitCore (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app:
    name: iOS app (simulator build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project Limit.xcodeproj \
            -scheme Limit \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

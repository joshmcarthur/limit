name: Limit
options:
  bundleIdPrefix: com.joshmcarthur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: T86Z8SF4GG
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Limit:
    path: .
targets:
  Limit:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: LimitWidgets
      - package: Limit
        product: LimitCore
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Limit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: Limit uses your location to find the road you’re on and to measure your speed. It never leaves your phone.
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshmcarthur.Limit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  LimitWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: Limit
        product: LimitCore
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Limit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshmcarthur.Limit.Widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
schemes:
  Limit:
    build:
      targets:
        Limit: all
    test:
      targets: []
